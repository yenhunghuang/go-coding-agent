name: Test
on: [push, pull_request]
jobs:
  test:
    strategy:
      # One platform failing should hide nothing about the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23.x', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          # No go.sum: this project has no dependencies outside the standard
          # library, so there is no module cache worth saving.
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o agent ./cmd/agent
      - run: ./agent --help
